openapi: "3.1.0"
info:
  title: Portfolio API — Auth (M1)
  version: "1.0.0"
  description: |
    Authentication layer for the portfolio admin panel.
    All auth state is carried in an **httpOnly cookie** named `token`.
    The frontend must use `credentials: 'include'` on every request.

servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://api.yoursite.com/api/v1
    description: Production

components:
  schemas:
    Session:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          description: MongoDB ObjectId of the admin user (24-char hex)
          example: "6634a1b2c3d4e5f6a7b8c9d0"
        email:
          type: string
          format: email
          example: "admin@yoursite.com"
        name:
          type: string
          example: "Mirzakhalov"
        role:
          type: string
          enum: [admin]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "UNAUTHORIZED"
            message:
              type: string
              example: "Invalid email or password."
            fields:
              type: object
              description: |
                Present on 400 validation errors. Keys map to the form input name.
              additionalProperties:
                type: string
              example:
                email: "Invalid email"
                password: "String must contain at least 8 character(s)"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

paths:
  /auth/login:
    post:
      summary: Log in as admin
      description: |
        Verifies credentials and issues a 7-day httpOnly JWT cookie.
        Rate-limited to 5 attempts per IP per 15 minutes.
        Response time is constant (timing-safe) regardless of email existence.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 200
      responses:
        "200":
          description: Login successful. Cookie is set automatically by the browser.
          headers:
            Set-Cookie:
              description: "token=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=604800"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      summary: Log out
      description: Clears the token cookie. Idempotent.
      operationId: logout
      responses:
        "200":
          description: Cookie cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /auth/me:
    get:
      summary: Get current session
      description: |
        Returns the session of the logged-in admin. Called on every admin app boot.
        Returns 401 if the cookie is absent, expired, tampered, or the user was deleted.
      operationId: me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
